name: Cubenergy
description: >-
  Cubenergy (ShenZhen Cubenergy Co., Ltd. / 库博能源) is a BloombergNEF Tier 1
  manufacturer of Battery Energy Storage Systems (BESS) for commercial,
  industrial, and utility-scale deployments. The company integrates
  self-developed Battery Systems, BMS, and EMS with grid, PV, wind, and diesel
  generation into standardized, all-in-one, transportable, EPC-free energy
  storage products (FlexCombo, PowerCombo E5, FlexCombo D2, FlexCube C1). Its
  products are certified to UL9540, UL9540A, and NFPA855, and it offers an O&M
  platform plus bankability (DNV certified, AIG insured) for funded and insured
  projects. Surfaced as a portfolio company of Qiming Ventures and added to the
  API Evangelist network. Cubenergy publishes a corporate marketing site with
  no public developer/API program at this time.
